<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debate Arena</title>
</head>
<body>

  <!-- Screen 1: Home -->
  <div id="screen-home">
    <h1>Debate Arena</h1>
    <input type="password" id="api-key-input" placeholder="Anthropic API key">
    <br><br>
    <select id="category-select">
      <option value="">Select a category</option>
      <option value="Politics">Politics</option>
      <option value="Philosophy">Philosophy</option>
      <option value="Finance">Finance</option>
      <option value="Economics">Economics</option>
      <option value="History">History</option>
      <option value="Ethics">Ethics</option>
      <option value="Science & Technology">Science &amp; Technology</option>
      <option value="Culture">Culture</option>
    </select>
    <br><br>
    <button onclick="startDebate()">Start Debate</button>
  </div>

  <!-- Screen 2: Debate -->
  <div id="screen-debate" style="display:none">
    <div id="debate-header">
      <p id="debate-topic"></p>
      <p id="debate-position"></p>
    </div>
    <div id="chat-thread">
      <!-- Messages will appear here -->
    </div>
    <div id="thinking-indicator" style="display:none">Opponent is thinking...</div>
    <input type="text" id="user-input" placeholder="Type your argument...">
    <button id="send-btn" onclick="sendArgument()">Send</button>
    <br><br>
    <button onclick="showScreen('end')">End Debate</button>
  </div>

  <!-- Screen 3: End -->
  <div id="screen-end" style="display:none">
    <h2>Session Summary</h2>
    <p>Summary will appear here.</p>
    <button onclick="showScreen('home')">New Debate</button>
  </div>

  <script>
    const TOPICS = {
      'Politics': [
        'Carbon taxes are more effective than renewable energy subsidies at reducing emissions',
        'The Electoral College should be abolished in favor of a national popular vote',
        'Term limits for members of Congress would improve American democracy',
        'Ranked-choice voting should replace first-past-the-post in all US elections',
        'Foreign aid does more harm than good to recipient nations',
        'Compulsory voting should be introduced in democratic countries',
        'The Senate filibuster should be permanently eliminated',
      ],
      'Philosophy': [
        'Free will is an illusion incompatible with a deterministic universe',
        'Moral obligations to strangers are just as strong as obligations to family',
        'A life without meaning is preferable to a life with false meaning',
        'Personal identity does not persist through time — you are not the same person you were ten years ago',
        'Objective moral truths exist independently of human belief',
        'It is rational to fear death',
        'Epistemic humility requires us to treat all cultures\' values as equally valid',
      ],
      'Finance': [
        'Stock buybacks should be banned as a form of market manipulation',
        'Central bank digital currencies would do more harm than good to financial privacy',
        'Short selling should be heavily restricted to protect market stability',
        'Algorithmic high-frequency trading should be taxed to slow speculation',
        'Venture capital funding distorts innovation toward profit over societal benefit',
        'The carried interest loophole is economically justified and should be preserved',
        'Retail investors are better served by passive index funds than active management',
      ],
      'Economics': [
        'A federal minimum wage of $20/hour would benefit workers on net',
        'Free trade agreements harm developing nations more than they help',
        'Automation will destroy more jobs than it creates over the next 20 years',
        'Universal Basic Income is a more efficient poverty tool than targeted welfare',
        'Austerity measures accelerate economic recovery after a financial crisis',
        'Breaking up big tech companies would reduce innovation',
        'Immigration has a net negative effect on wages for native low-skill workers',
      ],
      'History': [
        'The atomic bombings of Hiroshima and Nagasaki were morally justified',
        'The Industrial Revolution improved average human welfare on net',
        'The Treaty of Versailles was the primary cause of World War II',
        'Colonialism\'s economic legacy still drives global inequality today',
        'The Cold War was primarily the fault of the United States',
        'Napoleon Bonaparte did more to advance liberty than to suppress it',
        'The printing press did more to destabilize society than any other invention',
      ],
      'Ethics': [
        'Capital punishment is morally justifiable in cases of mass atrocity',
        'We have a moral obligation to give until giving causes us significant hardship',
        'Animals raised for food deserve the same moral consideration as pets',
        'Whistleblowing is always ethically justified when exposing government wrongdoing',
        'Affirmative action policies are ethically defensible means to a just end',
        'Lying is sometimes the most ethical course of action',
        'Parents have no right to raise their children in a particular religion',
      ],
      'Science & Technology': [
        'General-purpose AI should be subject to binding international regulation',
        'GMO crops should be embraced globally as an ethical imperative',
        'Nuclear energy is indispensable to achieving net-zero emissions',
        'Social media platforms bear legal responsibility for algorithmic radicalization',
        'Gene editing of human embryos for non-medical traits should be permitted',
        'Geoengineering the climate is too risky to research beyond the laboratory',
        'The benefits of space exploration do not justify its costs',
      ],
      'Culture': [
        'Social media has done more harm than good to adolescent mental health',
        'Globalization is destroying irreplaceable cultural diversity',
        'Public call-out culture is net harmful to social progress',
        'Artistic works should be judged independently of their creators\' moral character',
        'The decline of organized religion has weakened social cohesion in the West',
        'Cultural appropriation, on balance, promotes cross-cultural understanding',
        'Sports stars have a moral obligation to use their platform for political advocacy',
      ],
    };

    // Session state
    let currentTopic = '';
    let currentPosition = ''; // 'FOR' or 'AGAINST'
    let conversationHistory = []; // { role: 'user'|'assistant', content: string }[]

    function startDebate() {
      const apiKey = document.getElementById('api-key-input').value.trim();
      if (!apiKey) { alert('Please enter your Anthropic API key.'); return; }

      const category = document.getElementById('category-select').value;
      if (!category) { alert('Please select a category first.'); return; }

      const topicList = TOPICS[category];
      currentTopic = topicList[Math.floor(Math.random() * topicList.length)];
      currentPosition = Math.random() < 0.5 ? 'FOR' : 'AGAINST';
      conversationHistory = [];

      document.getElementById('chat-thread').innerHTML = '';
      document.getElementById('debate-topic').textContent = 'Topic: ' + currentTopic;
      document.getElementById('debate-position').textContent = 'Your position: ' + currentPosition;

      showScreen('debate');
    }

    function buildSystemPrompt() {
      const opponentSide = currentPosition === 'FOR' ? 'AGAINST' : 'FOR';
      return (
        `The debate topic is: "${currentTopic}". ` +
        `The user is arguing ${currentPosition}. You are arguing ${opponentSide}. ` +
        'You are a sharp, relentless debate opponent. ' +
        'Respond with the single strongest counterargument in 3-5 sentences. ' +
        'Do not agree, do not soften, do not break character. ' +
        'End with one sentence challenging the weakest point in their last argument.'
      );
    }

    function addMessageToThread(role, text) {
      const thread = document.getElementById('chat-thread');
      const div = document.createElement('div');
      div.dataset.role = role;
      div.textContent = (role === 'user' ? 'You: ' : 'Opponent: ') + text;
      thread.appendChild(div);
      thread.scrollTop = thread.scrollHeight;
      return div;
    }

    async function sendArgument() {
      const apiKey = document.getElementById('api-key-input').value.trim();
      const input = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const thinking = document.getElementById('thinking-indicator');
      const text = input.value.trim();
      if (!text) return;

      // Render user message and save to history
      addMessageToThread('user', text);
      conversationHistory.push({ role: 'user', content: text });
      input.value = '';

      // Lock UI
      sendBtn.disabled = true;
      thinking.style.display = 'block';

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model: 'claude-opus-4-6',
            max_tokens: 1024,
            stream: true,
            system: buildSystemPrompt(),
            messages: conversationHistory,
          }),
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || response.statusText);
        }

        // Stream the reply into a new bubble
        thinking.style.display = 'none';
        const bubble = addMessageToThread('assistant', '');
        let fullText = '';

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop(); // keep incomplete line in buffer
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6);
            if (data === '[DONE]') break;
            try {
              const evt = JSON.parse(data);
              if (evt.type === 'content_block_delta' && evt.delta?.type === 'text_delta') {
                fullText += evt.delta.text;
                bubble.textContent = 'Opponent: ' + fullText;
                document.getElementById('chat-thread').scrollTop =
                  document.getElementById('chat-thread').scrollHeight;
              }
            } catch (_) {}
          }
        }

        conversationHistory.push({ role: 'assistant', content: fullText });
      } catch (err) {
        thinking.style.display = 'none';
        addMessageToThread('assistant', 'Error: ' + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // Allow submitting with Enter key
    document.getElementById('user-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendArgument(); }
    });

    function showScreen(name) {
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById('screen-debate').style.display = 'none';
      document.getElementById('screen-end').style.display = 'none';
      document.getElementById('screen-' + name).style.display = 'block';
    }
  </script>

</body>
</html>
